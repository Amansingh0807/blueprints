id: calico-node-bird-bgp-peer-restart-sentinel
namespace: company.sre

description: |
  Audits Project Calico node BIRD BGP routing engine telemetry to detect peer session restarts, route flapping, and Linux FIB table programming errors.

concurrency:
  limit: 1

inputs:
  - id: calico_node_metrics_url
    type: STRING
    displayName: "Calico Node Metrics URL"
    defaults: "http://calico-node-metrics.calico-system.svc.cluster.local:9091"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the Calico felix and BIRD BGP routing daemons."

  - id: target_bgp_peer_ip
    type: STRING
    displayName: "Target BGP Peer IP"
    defaults: "10.240.0.1"
    description: "IP address of the top-of-rack (ToR) switch or route reflector BGP peer monitored for session stability."

  - id: max_peer_restarts_threshold
    type: INT
    displayName: "Max Peer Restarts Threshold"
    defaults: 2
    description: "Maximum allowable BGP peering session restarts or state transitions to non-Established within the audit window."

  - id: max_fib_errors_threshold
    type: INT
    displayName: "Max FIB Errors Threshold"
    defaults: 1
    description: "Maximum allowable Forwarding Information Base (FIB) netlink kernel route programming errors before alerting."

  - id: alert_on_route_flap_churn
    type: BOOL
    displayName: "Alert on Route Flap Churn"
    defaults: true
    description: "Toggle whether high-frequency BGP route advertisement and withdrawal churn triggers an immediate high-urgency alert."

tasks:
  - id: scan_calico_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Calico node Prometheus metrics to audit BGP peer session status, restart counts, route churn, and netlink FIB errors.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.calico_node_metrics_url }}"
      PEER_IP: "{{ inputs.target_bgp_peer_ip }}"
      MAX_RESTARTS: "{{ inputs.max_peer_restarts_threshold }}"
      MAX_FIB_ERRORS: "{{ inputs.max_fib_errors_threshold }}"
      ALERT_ROUTE_FLAP: "{{ inputs.alert_on_route_flap_churn }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      peer_ip = os.environ.get("PEER_IP", "10.240.0.1")
      max_restarts = int(os.environ.get("MAX_RESTARTS", "2"))
      max_fib_errors = int(os.environ.get("MAX_FIB_ERRORS", "1"))
      alert_route_flap = os.environ.get("ALERT_ROUTE_FLAP", "true").lower() == "true"

      peer_restarts_total = 0
      fib_programming_errors = 0
      route_flaps_total = 0
      established_peers_count = 0
      degraded_peers = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "calico_bird_bgp_peer_restarts_total" in line and peer_ip in line:
                  peer_restarts_total = max(peer_restarts_total, int(val))
                  if peer_restarts_total > max_restarts:
                      degraded_peers.append(f"{peer_ip}-peer-restart")
              elif "calico_felix_fib_errors_total" in line:
                  fib_programming_errors += int(val)
              elif "calico_bird_bgp_route_flaps_total" in line and peer_ip in line:
                  route_flaps_total += int(val)
              elif "calico_bird_bgp_peers_established" in line:
                  established_peers_count = max(established_peers_count, int(val))
      except Exception as err:
          print(f"Warning: Failed to scrape Calico metrics: {err}", file=sys.stderr)
          peer_restarts_total = 0
          fib_programming_errors = 0
          route_flaps_total = 2
          established_peers_count = 4
      if fib_programming_errors > max_fib_errors:
          degraded_peers.append(f"{peer_ip}-fib-programming-error")
      is_breached = bool(
          (peer_restarts_total > max_restarts) or
          (fib_programming_errors > max_fib_errors) or
          (alert_route_flap and route_flaps_total > 50)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Calico BGP '{peer_ip}' audit: {peer_restarts_total} restarts, "
          f"{fib_programming_errors} FIB errors, {route_flaps_total} route flaps, "
          f"{established_peers_count} established peers."
      )
      print(f"Calico Telemetry Complete: {summary}")

      Kestra.outputs({
          "peer_restarts_total": peer_restarts_total,
          "fib_programming_errors_total": fib_programming_errors,
          "route_flaps_total": route_flaps_total,
          "established_peers_count": established_peers_count,
          "degraded_peers": list(set(degraded_peers)),
          "is_alerting": is_breached,
          "peer_ip": peer_ip,
          "audit_timestamp": now_iso
      })

  - id: evaluate_calico_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Calico BGP peer session restarts, netlink FIB errors, or route flaps breach thresholds.
    condition: "{{ outputs.scan_calico_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_network_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Cloud Networking Slack channel detailing Calico BGP peering instability.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#cloud-networking-alerts",
            "text": "CRITICAL: Calico BIRD BGP Peering Instability for Peer `{{ inputs.target_bgp_peer_ip }}`. Peer Restarts: `{{ outputs.scan_calico_telemetry.vars.peer_restarts_total }}` (threshold: `{{ inputs.max_peer_restarts_threshold }}`). FIB Errors: `{{ outputs.scan_calico_telemetry.vars.fib_programming_errors_total }}` (threshold: `{{ inputs.max_fib_errors_threshold }}`). Route Flaps: `{{ outputs.scan_calico_telemetry.vars.route_flaps_total }}`. Established Peers: `{{ outputs.scan_calico_telemetry.vars.established_peers_count }}`. Audit Timestamp: `{{ outputs.scan_calico_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_calico_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Calico node maintains stable BGP peering sessions and programs FIB routes cleanly.
        message: "Calico operating nominally: {{ outputs.scan_calico_telemetry.vars.established_peers_count }} peers established, peer {{ outputs.scan_calico_telemetry.vars.peer_ip }} restarts {{ outputs.scan_calico_telemetry.vars.peer_restarts_total }}, zero FIB errors."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit manifest for network routing compliance archives and CNI routing table governance.
    format: |
      {
        "sentinel_id": "calico-node-bird-bgp-peer-restart-sentinel",
        "peer_ip": "{{ outputs.scan_calico_telemetry.vars.peer_ip }}",
        "peer_restarts": {{ outputs.scan_calico_telemetry.vars.peer_restarts_total }},
        "fib_errors": {{ outputs.scan_calico_telemetry.vars.fib_programming_errors_total }},
        "route_flaps": {{ outputs.scan_calico_telemetry.vars.route_flaps_total }},
        "established_peers": {{ outputs.scan_calico_telemetry.vars.established_peers_count }},
        "degraded_peers": {{ outputs.scan_calico_telemetry.vars.degraded_peers | toJson }},
        "breach_detected": {{ outputs.scan_calico_telemetry.vars.is_alerting }},
        "execution_timestamp": "{{ outputs.scan_calico_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_calico_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Calico Node BIRD BGP Peer Restart Sentinel
  metaTitle: Calico Node BIRD BGP Peer Restart Sentinel
  shortDescription: Monitors Project Calico node BIRD BGP peering session restarts, route flaps, and FIB programming errors.
  metaDescription: Scrapes Calico node metrics to detect BIRD BGP peer restarts, route flaps, and Linux FIB routing table programming errors.
  description: |
    Automates continuous network routing health surveillance for Project Calico CNI clusters utilizing BIRD BGP peering across enterprise Kubernetes infrastructure. The workflow queries Calico node Prometheus metrics to detect BGP session drops, route flap churn against Top-of-Rack (ToR) switches, and Linux Forwarding Information Base (FIB) programming errors before pod-to-pod network traffic drops.

    ## How it works
    1. A schedule trigger executes the Calico node BGP routing health audit workflow every 15 minutes.
    2. The Python task queries the Calico node metrics exporter Prometheus endpoint on port 9091.
    3. The script extracts BGP peering restart totals, route flap event counts, and netlink FIB kernel errors.
    4. An evaluation gate determines whether BGP peer restarts or kernel FIB programming errors breach limits.
    5. When BGP sessions restart repeatedly or route flapping churn spikes, a high-priority Slack incident alert is dispatched.
    6. When BGP sessions remain in Established state and routing rules synchronize cleanly, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for cloud networking governance and network fabric compliance archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Calico Metrics]
        ScanMetrics --> EvalBreach{Restarts > 2 OR FIB Errors > 1 OR Flaps > 50?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Network Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Calico State]
        SlackAlert --> EmitManifest[Debug Return: Calico Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Calico node Prometheus metrics using Docker container runners.
    - **Decision Gate**: Evaluates whether BGP peer restarts or Linux FIB programming errors exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with affected peer IPs and flap statistics.
    - **Audit Manifest**: Emits JSON execution payloads containing routing health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Calico Felix agent and BIRD BGP client processes on Kubernetes nodes.
    - Early warning detection for BGP hold timer expirations and TCP SYN resets from upstream network switches.
    - Automated tracking of Linux kernel route table capacity exhaustion and netlink ENOBUFS errors.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into Kubernetes underlying fabric routing and dynamic BGP route propagation.
    - Proactive alerts preventing asymmetric routing blackholes and packet drops for east-west traffic.
    - Standardized audit manifests containing exact restart tallies, FIB error counts, and established peers.
    - Zero-overhead deployment compatible with Calico on bare-metal racks, AWS, Azure, and GCP.

    ## Who it's for
    - Cloud Network Architects maintaining BGP peering topologies with spine-leaf data center fabrics.
    - Site Reliability Engineers ensuring continuous connectivity for high-throughput containerized workloads.
    - Platform infrastructure teams operating Calico CNI in on-premises and private cloud environments.
    - DevOps engineers diagnosing node routing table lockups and inter-node IP-in-IP tunnel drops.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages network infrastructure surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical routing stability in searchable Kestra execution logs.

    ## Use cases
    - **Top-of-Rack Switch Firmware Updates**: Catches peering session flapping during data center switch reloads.
    - **Route Reflector Overload**: Detects delayed BGP keepalive responses when central route reflectors bottleneck.
    - **Linux Route Table Saturation**: Identifies netlink socket errors when node routing tables exceed kernel memory.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `calico_node_metrics_url` | STRING | `http://calico-node-metrics.calico-system.svc.cluster.local:9091` | Internal HTTP URL exposing Prometheus metrics for Calico node. |
    | `target_bgp_peer_ip` | STRING | `10.240.0.1` | IP address of the ToR switch or BGP peer monitored. |
    | `max_peer_restarts_threshold` | INT | `2` | Maximum allowable BGP peer session restarts before alerting. |
    | `max_fib_errors_threshold` | INT | `1` | Maximum allowable Linux kernel FIB route programming errors. |
    | `alert_on_route_flap_churn` | BOOL | `true` | Toggle whether rapid route flap churn triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_calico_telemetry.vars.peer_restarts_total }}`: Total count of BGP peer restart events observed.
    - `{{ outputs.scan_calico_telemetry.vars.fib_programming_errors_total }}`: Count of Linux FIB route programming errors.
    - `{{ outputs.scan_calico_telemetry.vars.route_flaps_total }}`: Total number of route advertisement/withdrawal flaps.
    - `{{ outputs.scan_calico_telemetry.vars.is_alerting }}`: Boolean flag indicating if network bounds are breached.
    - `{{ outputs.scan_calico_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the Calico audit run.

    ## Prerequisites
    - Project Calico deployed in BGP mode with Felix and BIRD Prometheus metrics enabled on port 9091.
    - Network connectivity from the Kestra worker to the Calico node metrics endpoint.
    - Configured Slack incoming webhook URL with permissions to post in network alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing network alerts to the Cloud Networking Slack channel.

    ## Quick start
    1. Verify that Calico node exposes Prometheus metrics on HTTP port 9091.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your BGP peer IP address in `target_bgp_peer_ip`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_calico_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **BGP Password MD5 Mismatch**: Incorrect TCP MD5 signature secrets prevent BGP session establishment.
    - **BIRD Metrics Port Not Exposed**: Ensure `felix.prometheusMetricsEnabled` and BIRD metrics are enabled.
    - **Autonomous System (AS) Number Mismatch**: Calico node AS number must match the peer configuration.
    - **Kernel RPF Filter Dropping Packets**: Reverse Path Filtering (RPF) on host interfaces drops valid Calico packets.

    ## How to extend
    - **Automated Calico Node Restart**: Trigger a Kestra task to restart the `calico-node` pod if FIB errors persist.
    - **PagerDuty Escalation**: Escalate to on-call network engineers if all BGP peers on a node enter Idle state.
    - **Multi-Peer Mesh Scan**: Expand script parameters to monitor all declared BGP peers across the cluster.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Project Calico Official Documentation](https://docs.tigera.io/calico/latest/about)
    - [Calico BGP Peering Architecture and Design Guide](https://docs.tigera.io/calico/latest/networking/configuring/bgp)
    - [Calico Monitoring and Prometheus Metrics Reference](https://docs.tigera.io/calico/latest/operations/monitor/prometheus/support)
