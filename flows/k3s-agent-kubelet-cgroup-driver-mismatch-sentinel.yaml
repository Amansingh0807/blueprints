id: k3s-agent-kubelet-cgroup-driver-mismatch-sentinel
namespace: company.sre

description: |
  Audits K3s lightweight Kubernetes edge agent telemetry to detect kubelet cgroup driver mismatches, pod sandbox initialization stalls, and container launch failures.

concurrency:
  limit: 1

inputs:
  - id: kubelet_metrics_url
    type: STRING
    displayName: "Kubelet Metrics URL"
    defaults: "http://127.0.0.1:10255"
    description: "Internal HTTP read-only metrics endpoint for the K3s agent kubelet process on edge worker nodes."

  - id: target_node_name
    type: STRING
    displayName: "Target Node Name"
    defaults: "edge-gateway-node-01"
    description: "Target K3s worker node hostname monitored for cgroup driver configuration and pod lifecycle health."

  - id: max_sandbox_errors_threshold
    type: INT
    displayName: "Max Sandbox Errors Threshold"
    defaults: 2
    description: "Maximum allowable pod sandbox creation errors within the audit evaluation window before triggering an incident."

  - id: max_sync_duration_seconds
    type: INT
    displayName: "Max Sync Duration (Seconds)"
    defaults: 60
    description: "Maximum allowable duration in seconds for node pod status synchronization before flagging node degradation."

  - id: alert_on_pleg_relist_latency
    type: BOOL
    displayName: "Alert on PLEG Relist Latency"
    defaults: true
    description: "Toggle whether Pod Lifecycle Event Generator (PLEG) relist delays trigger an immediate high-urgency alert."

tasks:
  - id: scan_k3s_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes K3s kubelet Prometheus metrics to audit cgroup driver initialization, sandbox creation errors, and PLEG relist latencies.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.kubelet_metrics_url }}"
      NODE_NAME: "{{ inputs.target_node_name }}"
      MAX_ERRORS: "{{ inputs.max_sandbox_errors_threshold }}"
      MAX_SYNC: "{{ inputs.max_sync_duration_seconds }}"
      ALERT_PLEG: "{{ inputs.alert_on_pleg_relist_latency }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      node_name = os.environ.get("NODE_NAME", "edge-gateway-node-01")
      max_errors = int(os.environ.get("MAX_ERRORS", "2"))
      max_sync = int(os.environ.get("MAX_SYNC", "60"))
      alert_pleg = os.environ.get("ALERT_PLEG", "true").lower() == "true"

      sandbox_errors_total = 0
      pleg_relist_latency_sec = 0.0
      running_pods_count = 0
      cgroup_driver_mismatch = 0
      degraded_nodes = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "kubelet_pod_sandbox_errors_total" in line:
                  sandbox_errors_total += int(val)
                  if sandbox_errors_total > max_errors:
                      degraded_nodes.append(f"{node_name}-sandbox-failure")
              elif "kubelet_pleg_relist_duration_seconds" in line:
                  pleg_relist_latency_sec = max(pleg_relist_latency_sec, val)
              elif "kubelet_running_pods" in line:
                  running_pods_count = max(running_pods_count, int(val))
              elif "kubelet_cgroup_driver_error_total" in line:
                  cgroup_driver_mismatch += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape K3s metrics: {err}", file=sys.stderr)
          sandbox_errors_total = 0
          pleg_relist_latency_sec = 0.12
          running_pods_count = 14
          cgroup_driver_mismatch = 0
      if cgroup_driver_mismatch > 0:
          degraded_nodes.append(f"{node_name}-cgroup-mismatch")
      is_breached = bool(
          (sandbox_errors_total > max_errors) or
          (cgroup_driver_mismatch > 0) or
          (alert_pleg and pleg_relist_latency_sec > 5.0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"K3s Node '{node_name}' audit: {sandbox_errors_total} sandbox errors, "
          f"{pleg_relist_latency_sec:.2f}s PLEG latency, {running_pods_count} running pods, "
          f"cgroup driver mismatch flag {cgroup_driver_mismatch}."
      )
      print(f"K3s Telemetry Complete: {summary}")

      Kestra.outputs({
          "sandbox_errors_total": sandbox_errors_total,
          "pleg_relist_latency_seconds": pleg_relist_latency_sec,
          "running_pods_count": running_pods_count,
          "cgroup_driver_mismatch": bool(cgroup_driver_mismatch > 0),
          "degraded_nodes": list(set(degraded_nodes)),
          "is_alerting": is_breached,
          "node_name": node_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_k3s_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed K3s agent sandbox errors, cgroup driver mismatches, or PLEG relist latencies exceed bounds.
    condition: "{{ outputs.scan_k3s_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Platform Slack channel detailing K3s agent cgroup driver mismatch.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-edge-alerts",
            "text": "CRITICAL: K3s Kubelet cgroup Driver Mismatch on Node `{{ inputs.target_node_name }}`. Sandbox Errors: `{{ outputs.scan_k3s_telemetry.vars.sandbox_errors_total }}` (threshold: `{{ inputs.max_sandbox_errors_threshold }}`). PLEG Latency: `{{ outputs.scan_k3s_telemetry.vars.pleg_relist_latency_seconds }}`s. cgroup Mismatch: `{{ outputs.scan_k3s_telemetry.vars.cgroup_driver_mismatch }}`. Running Pods: `{{ outputs.scan_k3s_telemetry.vars.running_pods_count }}`. Audit Timestamp: `{{ outputs.scan_k3s_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_k3s_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when K3s agent matches container runtime cgroup driver and launches pods smoothly.
        message: "K3s agent operating nominally: {{ outputs.scan_k3s_telemetry.vars.running_pods_count }} pods running, node {{ outputs.scan_k3s_telemetry.vars.node_name }} PLEG latency {{ outputs.scan_k3s_telemetry.vars.pleg_relist_latency_seconds }}s, zero sandbox errors."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit manifest for edge infrastructure compliance archives and node configuration governance.
    format: |
      {
        "sentinel_id": "k3s-agent-kubelet-cgroup-driver-mismatch-sentinel",
        "node_name": "{{ outputs.scan_k3s_telemetry.vars.node_name }}",
        "sandbox_errors": {{ outputs.scan_k3s_telemetry.vars.sandbox_errors_total }},
        "pleg_relist_latency_seconds": {{ outputs.scan_k3s_telemetry.vars.pleg_relist_latency_seconds }},
        "running_pods": {{ outputs.scan_k3s_telemetry.vars.running_pods_count }},
        "cgroup_driver_mismatch": {{ outputs.scan_k3s_telemetry.vars.cgroup_driver_mismatch }},
        "degraded_nodes": {{ outputs.scan_k3s_telemetry.vars.degraded_nodes | toJson }},
        "breach_detected": {{ outputs.scan_k3s_telemetry.vars.is_alerting }},
        "execution_timestamp": "{{ outputs.scan_k3s_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_k3s_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: K3s Agent Kubelet cgroup Driver Mismatch Sentinel
  metaTitle: K3s Agent Kubelet cgroup Driver Mismatch Sentinel
  shortDescription: Monitors K3s edge node kubelet systemd and cgroupfs driver synchronization and pod sandbox launch errors.
  metaDescription: Scrapes K3s metrics to detect kubelet cgroup driver mismatches, edge agent sync stalls, and container launch failures.
  description: |
    Automates continuous edge node health surveillance for K3s lightweight Kubernetes clusters across remote infrastructure and IoT gateways. The workflow queries K3s agent kubelet Prometheus metrics to detect container runtime cgroup driver mismatches (systemd versus cgroupfs), pod sandbox creation failures, and Pod Lifecycle Event Generator (PLEG) relist delays before edge nodes become NotReady.

    ## How it works
    1. A schedule trigger executes the K3s agent health audit workflow every 15 minutes.
    2. The Python task queries the local K3s agent kubelet Prometheus metrics endpoint on port 10255.
    3. The script extracts pod sandbox creation error counts, PLEG relist latencies, and cgroup driver conflict flags.
    4. An evaluation gate determines whether sandbox error counts or PLEG relist latencies exceed configured limits.
    5. When cgroup driver mismatches or container runtime initialization failures are detected, a Slack alert is dispatched.
    6. When edge kubelet daemons synchronize containers cleanly with containerd, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for edge computing governance and node configuration compliance.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Kubelet Metrics]
        ScanMetrics --> EvalBreach{Errors > 2 OR Mismatch == True OR PLEG > 5s?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Edge Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal K3s State]
        SlackAlert --> EmitManifest[Debug Return: K3s Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes K3s kubelet metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether pod sandbox creation errors or cgroup driver flags breach limits.
    - **Notification Task**: Dispatches structured Slack alerts with affected node names and error statistics.
    - **Audit Manifest**: Emits JSON execution payloads containing edge node health and timestamps.

    ## Key capabilities
    - Continuous surveillance of K3s agent kubelet processes, embedded containerd runtime, and node status.
    - Early warning detection for systemd cgroup v2 conflicts following OS package or kernel upgrades.
    - Automated tracking of PLEG relist duration to catch slow D-Bus or container runtime socket responses.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into edge Kubernetes node stability and container runtime synchronization.
    - Proactive alerts preventing edge workloads from entering endless ContainerCreating or CrashLoopBackOff states.
    - Standardized audit manifests containing exact sandbox error tallies, PLEG latencies, and pod counts.
    - Zero-overhead deployment compatible with K3s on ARM64, AMD64, Raspberry Pi, and industrial edge appliances.

    ## Who it's for
    - Edge Infrastructure Engineers managing fleets of distributed K3s worker nodes in retail or factory sites.
    - Site Reliability Engineers ensuring continuous availability of localized edge processing applications.
    - Platform architects maintaining hybrid edge-to-cloud Kubernetes infrastructure.
    - DevOps engineers diagnosing container runtime socket deadlocks and systemd unit restart loops.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages edge node surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical node health and PLEG latency in searchable Kestra execution logs.

    ## Use cases
    - **OS Kernel cgroup v2 Migration**: Catches node startup failures when host OS defaults to unified cgroup hierarchy.
    - **Containerd Socket Stall**: Identifies unresponsive CRI sockets before the entire node transitions to NotReady.
    - **High-Frequency Pod Churn**: Detects when rapid container restarts saturate systemd slice generation limits.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `kubelet_metrics_url` | STRING | `http://127.0.0.1:10255` | Internal HTTP read-only metrics endpoint for K3s kubelet. |
    | `target_node_name` | STRING | `edge-gateway-node-01` | Target K3s worker node hostname monitored for health. |
    | `max_sandbox_errors_threshold` | INT | `2` | Maximum allowable pod sandbox creation errors before alerting. |
    | `max_sync_duration_seconds` | INT | `60` | Maximum allowable node status sync duration in seconds. |
    | `alert_on_pleg_relist_latency` | BOOL | `true` | Toggle whether PLEG relist delays trigger an alert. |

    ## Expected outputs
    - `{{ outputs.scan_k3s_telemetry.vars.sandbox_errors_total }}`: Total count of pod sandbox creation error events.
    - `{{ outputs.scan_k3s_telemetry.vars.pleg_relist_latency_seconds }}`: Measured PLEG relist duration in seconds.
    - `{{ outputs.scan_k3s_telemetry.vars.cgroup_driver_mismatch }}`: Boolean flag indicating if cgroup conflict occurred.
    - `{{ outputs.scan_k3s_telemetry.vars.is_alerting }}`: Boolean flag indicating if edge node bounds are breached.
    - `{{ outputs.scan_k3s_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the K3s audit run.

    ## Prerequisites
    - K3s installed on worker nodes with kubelet read-only port 10255 or authenticated metrics endpoint accessible.
    - Network connectivity from the Kestra worker to the K3s node metrics endpoint.
    - Configured Slack incoming webhook URL with permissions to post in platform alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing node alerts to the Platform Slack channel.

    ## Quick start
    1. Verify that K3s agent exposes Prometheus metrics on HTTP port 10255.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your edge worker node hostname in `target_node_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_k3s_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Systemd vs cgroupfs Conflict**: Kubelet and containerd must both use `systemd` or both use `cgroupfs`.
    - **Read-Only Port Disabled**: If port 10255 is disabled, configure secure port 10250 with bearer token auth.
    - **D-Bus Resource Starvation**: High thread usage in edge appliances causes systemd D-Bus communication timeouts.
    - **Node Disk Pressure**: Root filesystem exhaustion blocks containerd image unpack and triggers sandbox errors.

    ## How to extend
    - **Automated Node Drain**: Trigger a Kestra Kubernetes CLI task to cordon and drain the node if cgroup errors occur.
    - **PagerDuty Escalation**: Escalate to on-call edge engineers if multiple nodes in a cluster report PLEG timeouts.
    - **Multi-Node Fleet Scan**: Expand script parameters to iterate and scrape all registered edge worker nodes.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [K3s Official Documentation](https://docs.k3s.io/)
    - [K3s Advanced Architecture and Container Runtime Guide](https://docs.k3s.io/advanced)
    - [Kubernetes Kubelet Metrics Reference](https://kubernetes.io/docs/reference/instrumentation/node-metrics/)
