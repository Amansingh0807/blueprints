    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Apache Traffic Server Official Documentation](https://trafficserver.apache.org/)
    - [Apache Traffic Server SNI Routing and TLS Architecture Guide](https://docs.trafficserver.apache.org/en/latest/admin-guide/files/sni.yaml.en.html)
    - [Apache Traffic Server Statistics and Monitoring Reference](https://docs.trafficserver.apache.org/en/latest/admin-guide/monitoring/statistics/core-stats.en.html)
