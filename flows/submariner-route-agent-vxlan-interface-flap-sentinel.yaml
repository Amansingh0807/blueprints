    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Submariner Official Documentation](https://submariner.io/)
    - [Submariner Route Agent Architecture and VXLAN Guide](https://submariner.io/architecture/route-agent/)
    - [Submariner Metrics and Prometheus Reference](https://submariner.io/operations/deployment/monitoring/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
