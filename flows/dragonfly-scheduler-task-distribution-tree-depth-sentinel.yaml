    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Dragonfly Official Documentation](https://d7y.io/)
    - [Dragonfly Scheduler Architecture and P2P Algorithm Guide](https://d7y.io/docs/concepts/terminology/scheduler/)
    - [Dragonfly Monitoring and Metrics Reference](https://d7y.io/docs/operations/monitoring/metrics/)
